name: Deploy Lambda zip

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-upload-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Build Lambda zip
        run: |
          rm -rf package lambda.zip
          mkdir package
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -t package
          cp main.py aws_storage.py browser_handler.py email_handler.py file_handler.py utils.py package/
          cd package
          zip -r ../lambda.zip .

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name movie-alerts \
            --zip-file fileb://lambda.zip

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated --function-name movie-alerts